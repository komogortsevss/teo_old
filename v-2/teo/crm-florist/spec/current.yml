workspace:
  key: crm-florist
  type: service
  title: "CRM — Флорист"
  status: idea
  order: 1
  description: "Интерфейс для флористов — Kanban-воронка сборки букетов"
  goalKey: "1"
  spec: |-
    Конечный продукт: Kanban-воронка для флористов с 4 этапами обработки заказов.

    Бизнес-цель: визуализировать процесс сборки букетов и ускорить обработку заказов.
    Пользовательская цель: видеть все заказы на конкретную дату в виде воронки, быстро перемещать между этапами.

    ## КРИТИЧНЫЕ ИСПРАВЛЕНИЯ (проверить после генерации)

    ### Исправление 1: СУММА ЗАКАЗА (ОБЯЗАТЕЛЬНО)

    **Проблема:** Вместо суммы отображается прочерк или "не число ₽".

    **Причина:** Поле `total` в таблице orders имеет тип MoneyKind и хранится как массив: `[5400, "RUB"]`.

    **Решение:**
    ```tsx
    // Правильное извлечение суммы
    const orderTotal = Array.isArray(order.total) ? order.total[0] : order.total;
    const formattedTotal = Number(orderTotal).toLocaleString('ru-RU') + ' ₽';
    
    // В карточке заказа:
    <div className="order-total">{formattedTotal}</div>
    
    // В попапе заказа (крупно):
    <div className="order-total-popup">{formattedTotal}</div>
    ```

    **Проверка после генерации:**
    - Заказ #000051 должен показывать "5 400 ₽" (а не прочерк)

    ### Исправление 2: ДОПТОВАРЫ И ВАЗЫ (ПРИОРИТЕТ МАКСИМАЛЬНЫЙ)

    **Проблема:** Доптовары (вазы, секаторы) не отображаются в карточке заказа.

    **Структура данных заказа (ИСПРАВЛЕННАЯ - получена из v-2):**

    **Поле items[] (только букеты, без ваз):**
    ```json
    [
      {
        "id": "bouquet-id",
        "name": "Вегги и Брют",
        "quantity": 1,
        "priceAmount": 4400,
        "imageHash": "abc123.jpg"
      }
    ]
    ```

    **Поле addons[] (ВСЕ доптовары: вазы + секаторы + открытки):**
    ```json
    [
      {
        "id": "sekator-id",
        "name": "Секатор",
        "quantity": 1,
        "priceAmount": 590
      },
      {
        "id": "vase-m-id",
        "name": "Средняя ваза",
        "quantity": 2,
        "priceAmount": 0,
        "forBouquetId": "bouquet-id",
        "forBouquetName": "Вегги и Брют"
      }
    ]
    ```

    **ВАЖНО:** Вазы хранятся в `addons[]` с полями `forBouquetId` и `forBouquetName`, а НЕ внутри `items[].selectedVase`!

    **Таблица teo_addons (справочник) — использовать для fallback:**
    - addonId (PK): "vase-s", "vase-m", "vase-l", "sekator", "card"
    - name: "Маленькая ваза", "Средняя ваза", "Большая ваза", "Секатор", "Открытка"

    **Код отображения в карточке заказа (ИСПРАВЛЕННЫЙ):**
    ```tsx
    // Отображение БУКЕТОВ с привязанными ВАЗАМИ из addons[]
    {order.items?.map(item => {
      // Найти вазы для этого букета из addons[] по forBouquetId
      const itemVases = order.addons?.filter(addon => addon.forBouquetId === item.id) || [];
      
      return (
        <div key={item.id} className="order-item">
          <div className="bouquet-line">{item.name} × {item.quantity}</div>
          {/* Вазы привязанные к этому букету (есть forBouquetId) */}
          {itemVases.map((vase, idx) => (
            <div key={idx} className="vase-line" style={{fontSize: '12px', color: '#666', marginLeft: 12, marginTop: 2}}>
              {vase.name} × {vase.quantity}
            </div>
          ))}
        </div>
      );
    })}

    {/* Глобальные доптовары (секаторы и др.) — без forBouquetId */}
    {order.addons?.filter(addon => !addon.forBouquetId).length > 0 && (
      <div className="addons-section" style={{marginTop: 8, borderTop: '1px dashed #eee', paddingTop: 8}}>
        {order.addons
          .filter(addon => !addon.forBouquetId) // Только глобальные допы
          .map((addon, i) => (
            <div key={i} style={{fontSize: '12px', color: '#666'}}>
              {addon.name} × {addon.quantity}
            </div>
          ))}
      </div>
    )}
    ```

    **Логика отображения:**
    1. Для каждого букета в `items[]` найти вазы в `addons[]` где `forBouquetId === item.id`
    2. Показать вазы под соответствующим букетом (серым цветом, с отступом)
    3. Глобальные допы (без `forBouquetId`) показать отдельным блоком под букетами
    4. Использовать поле `name` напрямую из `addons[]` (там уже название от v-2)

    **Проверка после генерации (ОБЯЗАТЕЛЬНО):**
    1. Создать заказ с вазой — в карточке видно название вазы под букетом
    2. Создать заказ с секатором — в карточке видно "Секатор × 1"
    3. Создать заказ с вазой и секатором — видны ОБА доптовара

    ### Исправление 3: Звук при новом заказе (Web Audio API)

    ```javascript
    let audioCtx = null;
    
    // Инициализация при первом клике (обязательно для браузера)
    document.addEventListener('click', () => {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }, { once: true });
    
    function playOrderSound() {
      if (!audioCtx || localStorage.getItem('muted') === 'true') return;
      
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      
      osc.type = 'sine';
      osc.frequency.setValueAtTime(880, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(440, audioCtx.currentTime + 0.5);
      
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
      
      osc.start();
      osc.stop(audioCtx.currentTime + 0.5);
    }
    
    // Вызвать playOrderSound() только когда order.createdAt > pageLoadTime
    ```

    ### Исправление 4: Ссылка на букет в попапе (КРИТИЧНО - правильный URL)

    **Правильный URL:** `https://teo2you.chatium.ru/v-2/product?id={item.id}`
    
    **Неправильно:** `https://teo2you.chatium.ru/app/start/~/v-2/product/{item.id}` ❌
    
    Открывать в новой вкладке (target="_blank").

    ### Исправление 5: Попап не обрезает кнопку

    CSS:
    ```css
    .popup { max-height: 90vh; overflow-y: auto; display: flex; flex-direction: column; }
    .popup-content { flex-grow: 1; overflow-y: auto; }
    .popup-footer { flex-shrink: 0; position: sticky; bottom: 0; background: white; padding: 16px; }
    ```

    ### Исправление 6: Убрать мерцающие индикаторы

    Polling каждые 5 секунд без UI-индикации.

    ## Структура интерфейса

    ### Шапка
    - Табы: Сегодня | Завтра | Послезавтра
    - Кнопка звука (🔊 / 🔇)

    ### Kanban-воронка (4 колонки)
    1. **Новый** (status: new) — жёлтый
    2. **Собран** (status: assembled) — зелёный
    3. **У курьера** (status: ready_for_courier) — синий
    4. **Доставлен** (status: delivered) — серый

    ### Карточка заказа (ОБЯЗАТЕЛЬНО ПРОВЕРИТЬ ДОПТОВАРЫ)
    - Номер заказа + время доставки
    - Фото букета (items[0].imageHash)
    - **Состав заказа (ОБЯЗАТЕЛЬНО):**
      - **Букет:** {item.name} × {item.quantity}
      - **Ваза (ЕСТЬ У БУКЕТА):** Показать серым цветом под букетом: "{addonName} × {quantity}"
      - **Доптовары (ЕСТЬ В ЗАКАЗЕ):** Отдельным блоком под букетами
    - **Сумма заказа (ОБЯЗАТЕЛЬНО):** правильное форматирование из `total[0]` с проверкой `Array.isArray`
    - Кнопка действия (переход на следующий этап)

    ### Попап деталей
    Шапка: "Заказ #1234 — 10:00-12:00" [×]

    Секция "Заказ":
    - Список букетов с фото
    **Название букета — кликабельная ссылка** (URL: `/v-2/product?id={item.id}`)
     - Вазы и допы с названиями
    - **Сумма заказа крупно**

    Секция "Контакты":
    - Заказчик: customerName, customerPhone
    - Получатель: recipientName, recipientPhone (если gift)

    Секция "Доставка":
    - Адрес полностью
    - Комментарий к адресу

    Секция "Комментарии":
    - Текст записки (cardText)
    - Комментарий к заказу (comment)

    Кнопка действия внизу (sticky, всегда видна)

    ## Real-time обновление
    - HTTP polling каждые 5 секунд (тихо, без UI)
    - Звук Web Audio API при новом заказе (если not muted и createdAt > pageLoadTime)
    - Toast-уведомление при новом заказе
    - Без бейджа "New", без анимаций pulse/glow

    ## Drag-and-drop
    - @dnd-kit/core для перетаскивания между колонками
    - При drop: обновить status, записать в orderStatusHistory, сгенерировать order_status_changed

    ## Доступ
    Только role = 'florist' из staff

    ## Таблицы
    orders, orderStatusHistory, staff, teo_addons

    ## События
    Слушает: order_created
    Генерирует: order_status_changed

    ## ПРОВЕРКА ПОСЛЕ ГЕНЕРАЦИИ
    1. Заказ #000051 должен показывать сумму "5 400 ₽" (не прочерк)
    2. Создать заказ с вазой — в карточке видно "Ваза × 1"
    3. Создать заказ с секатором — в карточке видно "Секатор × 1"
    4. Кликнуть на название букета в попапе — открывается сайт

